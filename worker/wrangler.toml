name = "corbin-student-ai-hub-api"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = true

[vars]
ENVIRONMENT = "staging"
# Set ALLOWED_ORIGINS to the exact Pages preview origin before enabling browser calls.
# Never put API keys, tokens, or credentials in this file.

[[d1_databases]]
binding = "DB"
database_name = "corbin-student-ai-hub"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Add an R2 bucket binding only when lesson uploads are implemented.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "corbin-student-ai-hub-assets"
