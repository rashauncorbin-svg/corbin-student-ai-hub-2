name: Validate Student Hub
on:
  push:
    branches:
      - main
      - staging/student-hub-v2
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source, assets, and schema
        run: node scripts/validate.mjs
